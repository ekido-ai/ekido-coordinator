# Database migrations for the coordinator. The database comes from DATABASE_URL (see alembic/env.py), never from
# this file, so no credentials live in the repository.
#   DATABASE_URL=postgresql+psycopg://... python -m alembic -c apps/coordinator/alembic.ini upgrade head
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
