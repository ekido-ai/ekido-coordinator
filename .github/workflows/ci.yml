name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: coordinator
            dir: .
            path: "."
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy>=2" "fastapi>=0.115" httpx pydantic-settings websockets "uvicorn>=0.30" eth-account web3 "pyyaml==6.0.2" "ekido-core @ git+https://github.com/ekido-ai/ekido-core@v0.4.4#subdirectory=packages/ekido_core"
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        env:
          PYTHONPATH: ${{ matrix.path }}
          PYTHONDONTWRITEBYTECODE: "1"
        # Job keys need a wrapper and the app refuses to start without one. The tests get a throwaway identity made here for this run only.
        run: |
          export JOB_KEY_WRAP=local
          export LOCAL_WRAP_IDENTITY="$(python -c 'import pyrage; print(pyrage.x25519.Identity.generate())')"
          python -m unittest discover -s tests

  postgres:
    name: Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin
          POSTGRES_DB: ekido
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-admin
      SERVICE_URL: postgresql+psycopg://ekido_coordinator:ci-coordinator@127.0.0.1:5432/ekido?options=-csearch_path%3Dcoordinator
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install "sqlalchemy>=2" "fastapi>=0.115" pydantic-settings eth-account web3 "alembic==1.20.1" "psycopg[binary]==3.3.6" "ekido-core @ git+https://github.com/ekido-ai/ekido-core@v0.4.4#subdirectory=packages/ekido_core"
      - name: This service's own user and schema, as ekido-infra's postgres.sh sets up
        run: |
          psql -h 127.0.0.1 -U postgres -d ekido -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE ekido_coordinator LOGIN PASSWORD 'ci-coordinator';
          CREATE SCHEMA coordinator AUTHORIZATION ekido_coordinator;
          ALTER ROLE ekido_coordinator IN DATABASE ekido SET search_path = coordinator;
          REVOKE ALL ON SCHEMA coordinator FROM PUBLIC;
          SQL
      - name: Migrations, the model check and the write paths
        run: |
          DATABASE_URL="$SERVICE_URL" python -m alembic -c alembic/alembic.ini upgrade head
          DATABASE_URL="$SERVICE_URL" python -m alembic -c alembic/alembic.ini check
          TEST_DATABASE_URL="$SERVICE_URL" python -m unittest -v tests.test_postgres
          DATABASE_URL="$SERVICE_URL" python -m alembic -c alembic/alembic.ini downgrade base
